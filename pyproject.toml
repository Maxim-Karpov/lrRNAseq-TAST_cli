[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lrrnaseq-tast"
dynamic = ["version"]
description = "Plot BLAST alignments of full-length long-read RNAseq transcripts to a genomic region to reveal genes and splicing"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Maxim Karpov"}]
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.21",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tast = "tast.cli:main"

[tool.setuptools.dynamic]
version = {attr = "tast.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
